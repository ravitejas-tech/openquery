openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A realistic spec covering the common cases.

servers:
  - url: https://api.example.com/v1

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return.
          schema:
            type: integer
            format: int32
        - name: status
          in: query
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        "200":
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        "201":
          description: The created pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }

  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by ID
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          description: The pet's unique identifier.
          schema: { type: string }
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
    put:
      operationId: updatePet
      summary: Update a pet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        "200":
          description: The updated pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted.

  /owners/{ownerId}/pets:
    get:
      operationId: listOwnerPets
      summary: List an owner's pets
      tags: [owners, pets]
      parameters:
        - name: ownerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The owner's pets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }

components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Unique identifier.
        name:
          type: string
        tag:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
        owner:
          $ref: "#/components/schemas/Owner"
        birthDate:
          type: string
          format: date

    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string }
        tag: { type: string }

    Owner:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
